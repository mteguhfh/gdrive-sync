name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Syntax check
        run: |
          bash -n gdrive-sync.sh
          bash -n tests/run_tests.sh

      - name: ShellCheck
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJf - --strip-components=1 shellcheck-v0.10.0/shellcheck
          sudo mv shellcheck /usr/local/bin/
          shellcheck --severity=error gdrive-sync.sh tests/run_tests.sh

      - name: Run tests
        run: ./tests/run_tests.sh